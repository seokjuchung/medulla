[parameters]
gOre_threshold = 25 # MeV
muon_threshold = 25 # MeV
pion_threshold = 25 # MeV
proton_threshold = 50 # MeV
fiducial_xdist_pos = 20 # cm
fiducial_xdist_neg = 20 # cm
fiducial_ydist_pos = 20 # cm
fiducial_ydist_neg = 20 # cm
fiducial_zdist_pos = 50 # cm
fiducial_zdist_neg = 10 # cm

[general]
output = "/exp/sbnd/data/users/sc5303/NCDelta/gOre_1g0p_1g1p_single"
fsthresh = [
  "@gOre_threshold",
  "@muon_threshold",
  "@pion_threshold",
  "@proton_threshold",
]
pidfn = "gOre_pid"


[[category]] # Topo 1g0p
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "single_photon",       parameters = [ "@gOre_threshold" ]  },
  { name = "no_electrons",        parameters = [ "@gOre_threshold" ]  },
  { name = "no_muons",            parameters = [ "@muon_threshold" ]  },
  { name = "no_charged_pions",    parameters = [ "@pion_threshold" ]  },
  { name = "no_protons",          parameters = [ "@proton_threshold" ]},
]

[[category]] # Topo 1g1p
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "single_photon",       parameters = [ "@gOre_threshold" ]  },
  { name = "no_electrons",        parameters = [ "@gOre_threshold" ]  },
  { name = "no_muons",            parameters = [ "@muon_threshold" ]  },
  { name = "no_charged_pions",    parameters = [ "@pion_threshold" ]  },
  { name = "single_proton",       parameters = [ "@proton_threshold" ]},
]

[[category]] # Topo 1gMp
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
