# gORe_pion_truth.toml
#
# Mirrors gORe_main.toml, adding pi0 truth variables (pion_vars_gOre.h) to the
# selected_1g0p and selected_1gNp trees.  Use this toml to study misidentified
# NC pi0 events (true_mc_category == 2) that pass the single-photon selection.
#
# New MCTruth branches (from obj.prim, pi0 GENIE primary):
#   pion_* — position, momentum, wall info, G4 process codes, deposited energy
#
# New True branches (from obj.particles, ancestor_pdg_code == 111):
#   n_pi0_photons, leading/subleading_pi0_photon_* — SPINE truth photon daughters
#
# Sample: mc1e20 reweighted flat CAF files
# Output: /exp/sbnd/data/users/sc5303/NCDelta/pion_truth

[parameters]
gOre_threshold = 25 # MeV
muon_threshold = 25 # MeV
pion_threshold = 25 # MeV
proton_threshold = 50 # MeV
fiducial_xdist_pos = 20 # cm
fiducial_xdist_neg = 20 # cm
fiducial_ydist_pos = 20 # cm
fiducial_ydist_neg = 20 # cm
fiducial_zdist_pos = 50 # cm
fiducial_zdist_neg = 10 # cm

[general]
output = "/exp/sbnd/data/users/sc5303/NCDelta/pion_truth"
fsthresh = [
  "@gOre_threshold",
  "@muon_threshold",
  "@pion_threshold",
  "@proton_threshold",
]
pidfn = "gOre_pid"


[[category]] # Topo 1g0p
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "single_photon",       parameters = [ "@gOre_threshold" ]  },
  { name = "no_electrons",        parameters = [ "@gOre_threshold" ]  },
  { name = "no_muons",            parameters = [ "@muon_threshold" ]  },
  { name = "no_charged_pions",    parameters = [ "@pion_threshold" ]  },
  { name = "no_protons",          parameters = [ "@proton_threshold" ]},
]

[[category]] # Topo 1g1p
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "single_photon",       parameters = [ "@gOre_threshold" ]  },
  { name = "no_electrons",        parameters = [ "@gOre_threshold" ]  },
  { name = "no_muons",            parameters = [ "@muon_threshold" ]  },
  { name = "no_charged_pions",    parameters = [ "@pion_threshold" ]  },
  { name = "single_proton",       parameters = [ "@proton_threshold" ]},
]

[[category]] # Topo 1gNp (N >= 1)
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "single_photon",       parameters = [ "@gOre_threshold" ]  },
  { name = "no_electrons",        parameters = [ "@gOre_threshold" ]  },
  { name = "no_muons",            parameters = [ "@muon_threshold" ]  },
  { name = "no_charged_pions",    parameters = [ "@pion_threshold" ]  },
  { name = "multiproton",       parameters = [ "@proton_threshold" ]},
]

[[category]] # contained, fiducial, single photon
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "single_photon",        parameters = [ "@gOre_threshold" ] },
  { name = "no_electrons",         parameters = [ "@gOre_threshold" ] },
  { name = "no_muons",             parameters = [ "@muon_threshold" ] },
  { name = "no_charged_pions",     parameters = [ "@pion_threshold" ] },
]

[[category]] # single photon
cuts = [
  { name = "neutrino"                                                 },
  { name = "single_photon",        parameters = [ "@gOre_threshold" ] },
  { name = "no_electrons",         parameters = [ "@gOre_threshold" ] },
  { name = "no_muons",             parameters = [ "@muon_threshold" ] },
  { name = "no_charged_pions",     parameters = [ "@pion_threshold" ] },
]

[[category]] # contained, fiducial, single electron
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "single_electron",      parameters = [ "@gOre_threshold" ] },
  { name = "no_photons",           parameters = [ "@gOre_threshold" ] },
  { name = "no_muons",             parameters = [ "@muon_threshold" ] },
  { name = "no_charged_pions",     parameters = [ "@pion_threshold" ] },
]

[[category]] # single electron
cuts = [
  { name = "neutrino"                                                 },
  { name = "single_electron",      parameters = [ "@gOre_threshold" ] },
  { name = "no_photons",           parameters = [ "@gOre_threshold" ] },
  { name = "no_muons",             parameters = [ "@muon_threshold" ] },
  { name = "no_charged_pions",     parameters = [ "@pion_threshold" ] },
]

[[category]] # contained, fiducial, dual photon
cuts = [
  { name = "neutrino"                                                 },
  { name = "containment_cut"                                          },
  { name = "fiducial_cut"                                             },
  { name = "dual_photon",          parameters = [ "@gOre_threshold" ] },
  { name = "no_electrons",         parameters = [ "@gOre_threshold" ] },
  { name = "no_muons",             parameters = [ "@muon_threshold" ] },
  { name = "no_charged_pions",     parameters = [ "@pion_threshold" ] },
]

[[category]] # dual photon
cuts = [
  { name = "neutrino"                                                 },
  { name = "dual_photon",          parameters = [ "@gOre_threshold" ] },
  { name = "no_electrons",         parameters = [ "@gOre_threshold" ] },
  { name = "no_muons",             parameters = [ "@muon_threshold" ] },
  { name = "no_charged_pions",     parameters = [ "@pion_threshold" ] },
]

[[category]] # NC
cuts = [
  { name = "neutrino" },
  { name = "!iscc"    },
]

[[category]] # CC
cuts = [
  { name = "neutrino" },
]

[[category]] # cosmic
cuts = [
  { name = "!neutrino" },
]

[[sample]]
name = "simulation"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc1e20/input*-reweighted.flat.caf.root"
ismc = true
disable = false


# ============================================================
# Tree: selection (1γ0p) — misidentified pions have mc_category == 2 here
# ============================================================
[[tree]]
name = "selected_1g0p"
sim_only = false
add_systematics = true
mode = "reco"
cut = [
  { name = "fiducial_cut",           type = "reco" },
  { name = "containment_cut",        type = "reco" },
  { name = "valid_flashmatch",       type = "reco" },
  { name = "gOre_topology",          type = "reco", parameters = [ "@gOre_threshold", "@muon_threshold", "@pion_threshold" ] },
  { name = "no_proton_inclusive",    type = "reco", parameters = [ "@proton_threshold" ] },
]

branch = [
  # --- Standard MC Truth (from gORe_main.toml) ---
  { name = "cc",               type = "mctruth" },
  { name = "pdg",              type = "mctruth" },
  { name = "interaction_mode", type = "mctruth" },
  { name = "interaction_type", type = "mctruth" },
  { name = "neutrino_energy",  type = "mctruth" },
  { name = "baryon_res_code",  type = "mctruth" },
  { name = "delta_mass_N_MC",  type = "mctruth", parameters = [ "@gOre_threshold", "@muon_threshold", "@proton_threshold", "@pion_threshold",
                                                                "@fiducial_xdist_pos", "@fiducial_xdist_neg", "@fiducial_ydist_pos", "@fiducial_ydist_neg", "@fiducial_zdist_pos", "@fiducial_zdist_neg", ] },
  { name = "delta_mass_P_MC",  type = "mctruth", parameters = [ "@gOre_threshold", "@muon_threshold", "@proton_threshold", "@pion_threshold",
                                                                "@fiducial_xdist_pos", "@fiducial_xdist_neg", "@fiducial_ydist_pos", "@fiducial_ydist_neg", "@fiducial_zdist_pos", "@fiducial_zdist_neg", ] },
  { name = "neutron_momentum", type = "mctruth", parameters = [ "@gOre_threshold", "@muon_threshold", "@proton_threshold", "@pion_threshold",
                                                                "@fiducial_xdist_pos", "@fiducial_xdist_neg", "@fiducial_ydist_pos", "@fiducial_ydist_neg", "@fiducial_zdist_pos", "@fiducial_zdist_neg", ] },
  { name = "neutron_cosTh",    type = "mctruth", parameters = [ "@gOre_threshold", "@muon_threshold", "@proton_threshold", "@pion_threshold",
                                                                "@fiducial_xdist_pos", "@fiducial_xdist_neg", "@fiducial_ydist_pos", "@fiducial_ydist_neg", "@fiducial_zdist_pos", "@fiducial_zdist_neg", ] },
  { name = "mc_category",      type = "mctruth", parameters = [ "@gOre_threshold", "@muon_threshold", "@proton_threshold", "@pion_threshold",
                                                                "@fiducial_xdist_pos", "@fiducial_xdist_neg", "@fiducial_ydist_pos", "@fiducial_ydist_neg", "@fiducial_zdist_pos", "@fiducial_zdist_neg", ] },
  # --- Pi0 truth: GENIE primary (pion_vars_gOre.h, MCTruth scope) ---
  { name = "n_genie_pions",          type = "mctruth" },
  { name = "pion_gen_energy",        type = "mctruth" },
  { name = "pion_start_energy",      type = "mctruth" },
  { name = "pion_gen_x",             type = "mctruth" },
  { name = "pion_gen_y",             type = "mctruth" },
  { name = "pion_gen_z",             type = "mctruth" },
  { name = "pion_gen_px",            type = "mctruth" },
  { name = "pion_gen_py",            type = "mctruth" },
  { name = "pion_gen_pz",            type = "mctruth" },
  { name = "pion_start_x",           type = "mctruth" },
  { name = "pion_start_y",           type = "mctruth" },
  { name = "pion_start_z",           type = "mctruth" },
  { name = "pion_end_x",             type = "mctruth" },
  { name = "pion_end_y",             type = "mctruth" },
  { name = "pion_end_z",             type = "mctruth" },
  { name = "pion_contained",         type = "mctruth" },
  { name = "pion_wallout",           type = "mctruth" },
  { name = "pion_wallin",            type = "mctruth" },
  { name = "pion_start_process",     type = "mctruth" },
  { name = "pion_end_process",       type = "mctruth" },
  { name = "pion_generator",         type = "mctruth" },
  { name = "pion_length",            type = "mctruth" },
  { name = "pion_vis_e",             type = "mctruth" },
  { name = "pion_nhit",              type = "mctruth" },
  { name = "pion_n_daughters",       type = "mctruth" },
  # --- Standard True (from gORe_main.toml) ---
  { name = "neutrino_id",   type = "true" },
  { name = "category",      type = "true" },
  { name = "gOre_category", type = "true", parameters = [ "@gOre_threshold", "@muon_threshold", "@proton_threshold", "@pion_threshold" ] },
  # --- Pi0 truth: SPINE photon daughters (pion_vars_gOre.h) ---
  # Branch names: true_leading_pi0_photon_<var> / true_subleading_pi0_photon_<var>
  { name = "n_pi0_photons",           type = "true" },
  # --- G4 truth: pi0 photon daughters from rec.true_particles (pion_vars_gOre.h, G4Truth scope) ---
  # Branch names: g4truth_photon_leading_* / g4truth_photon_subleading_*
  # Leading pi0 photon (G4)
  { name = "photon_leading_g4id",           type = "g4truth" },
  { name = "photon_leading_parent",         type = "g4truth" },
  { name = "photon_leading_pdg",            type = "g4truth" },
  { name = "photon_leading_interaction_id", type = "g4truth" },
  { name = "photon_leading_start_e",        type = "g4truth" },
  { name = "photon_leading_gen_x",          type = "g4truth" },
  { name = "photon_leading_gen_y",          type = "g4truth" },
  { name = "photon_leading_gen_z",          type = "g4truth" },
  { name = "photon_leading_start_x",        type = "g4truth" },
  { name = "photon_leading_start_y",        type = "g4truth" },
  { name = "photon_leading_start_z",        type = "g4truth" },
  { name = "photon_leading_end_x",          type = "g4truth" },
  { name = "photon_leading_end_y",          type = "g4truth" },
  { name = "photon_leading_end_z",          type = "g4truth" },
  { name = "photon_leading_startp_x",       type = "g4truth" },
  { name = "photon_leading_startp_y",       type = "g4truth" },
  { name = "photon_leading_startp_z",       type = "g4truth" },
  { name = "photon_leading_length",         type = "g4truth" },
  { name = "photon_leading_contained",      type = "g4truth" },
  { name = "photon_leading_wallout",        type = "g4truth" },
  { name = "photon_leading_wallin",         type = "g4truth" },
  { name = "photon_leading_start_process",  type = "g4truth" },
  { name = "photon_leading_end_process",    type = "g4truth" },
  { name = "photon_leading_generator",      type = "g4truth" },
  { name = "photon_leading_vis_e",          type = "g4truth" },
  { name = "photon_leading_nhit",           type = "g4truth" },
  # Subleading pi0 photon (G4) — NaN/kNoMatch if missing shower
  { name = "photon_subleading_g4id",           type = "g4truth" },
  { name = "photon_subleading_parent",         type = "g4truth" },
  { name = "photon_subleading_pdg",            type = "g4truth" },
  { name = "photon_subleading_interaction_id", type = "g4truth" },
  { name = "photon_subleading_start_e",        type = "g4truth" },
  { name = "photon_subleading_gen_x",          type = "g4truth" },
  { name = "photon_subleading_gen_y",          type = "g4truth" },
  { name = "photon_subleading_gen_z",          type = "g4truth" },
  { name = "photon_subleading_start_x",        type = "g4truth" },
  { name = "photon_subleading_start_y",        type = "g4truth" },
  { name = "photon_subleading_start_z",        type = "g4truth" },
  { name = "photon_subleading_end_x",          type = "g4truth" },
  { name = "photon_subleading_end_y",          type = "g4truth" },
  { name = "photon_subleading_end_z",          type = "g4truth" },
  { name = "photon_subleading_startp_x",       type = "g4truth" },
  { name = "photon_subleading_startp_y",       type = "g4truth" },
  { name = "photon_subleading_startp_z",       type = "g4truth" },
  { name = "photon_subleading_length",         type = "g4truth" },
  { name = "photon_subleading_contained",      type = "g4truth" },
  { name = "photon_subleading_wallout",        type = "g4truth" },
  { name = "photon_subleading_wallin",         type = "g4truth" },
  { name = "photon_subleading_start_process",  type = "g4truth" },
  { name = "photon_subleading_end_process",    type = "g4truth" },
  { name = "photon_subleading_generator",      type = "g4truth" },
  { name = "photon_subleading_vis_e",          type = "g4truth" },
  { name = "photon_subleading_nhit",           type = "g4truth" },
  # --- Standard Reco (from gORe_main.toml) ---
  { name = "fiducial",       type = "reco" },
  { name = "containment",    type = "reco" },
  { name = "flash",          type = "reco" },
  { name = "valid_flashmatch", type = "reco" },
  { name = "gOre_topology",  type = "reco", parameters = [ "@gOre_threshold", "@muon_threshold", "@pion_threshold" ] },
  { name = "gOre_topology_no_primary",  type = "reco", parameters = [ "@gOre_threshold", "@muon_threshold", "@pion_threshold" ] },
  { name = "flash_time",     type = "reco" },
  { name = "flash_total_pe", type = "reco" },
